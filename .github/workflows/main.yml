name: CI Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-et-test:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t atelier-web .

      - name: Lancer le conteneur
        run: docker run -d -p 8000:8000 --name mon-site atelier-web

      - name: Tester la page HTML et le CSS
        run: |
          sleep 5
          curl --fail http://localhost:8000/
          curl --fail http://localhost:8000/style.css

      - name: Afficher les logs en cas d'échec
        if: failure()
        run: docker logs mon-site
