name: CI Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-et-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t atelier-web .

      - name: Lancer le conteneur
        run: docker run -d -p 8000:8000 --name mon-site atelier-web

      - name: Tester la page HTML et le CSS
        run: |
          sleep 5
          curl --fail http://localhost:8000/
          curl --fail http://localhost:8000/style.css

      - name: Afficher les logs en cas d'échec
        if: failure()
        run: docker logs mon-site

      - name: Connexion à GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image Docker
        if: github.event_name == 'push'
        run: |
          docker tag atelier-web ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest